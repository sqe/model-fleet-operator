apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentregistrations.fleet.sqe.io
spec:
  group: fleet.sqe.io
  scope: Namespaced
  names: {kind: AgentRegistration, listKind: AgentRegistrationList, plural: agentregistrations, singular: agentregistration, shortNames: [areg]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Replicas, type: integer, jsonPath: .status.readyReplicas}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [name, description, version, endpoint, kafka_topic, kafka_result_topic, max_concurrent_tasks, timeout_seconds, skills]
              properties:
                name: {type: string, minLength: 1}
                description: {type: string, minLength: 1}
                version: {type: string, minLength: 1}
                endpoint: {type: string, pattern: '^https?://'}
                kafka_topic: {type: string, minLength: 1}
                kafka_result_topic: {type: string, minLength: 1}
                max_concurrent_tasks: {type: integer, minimum: 1}
                timeout_seconds: {type: integer, minimum: 1}
                skills:
                  type: array
                  items:
                    type: object
                    required: [id, name, description]
                    properties:
                      id: {type: string, minLength: 1}
                      name: {type: string, minLength: 1}
                      description: {type: string, minLength: 1}
                      input_schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
                transports:
                  type: array
                  items:
                    type: object
                    required: [protocol, endpoint]
                    properties:
                      protocol: {type: string, enum: [kafka, http, grpc]}
                      endpoint: {type: string, minLength: 1}
                runtime:
                  type: object
                  required: [deploymentName]
                  properties:
                    deploymentName: {type: string, minLength: 1}
                    activeReplicas: {type: integer, minimum: 1, default: 1}
                suspend: {type: boolean, default: false}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Registered, Active, Suspended, Missing, Invalid]}
                message: {type: string}
                readyReplicas: {type: integer, minimum: 0}
                observedGeneration: {type: integer, format: int64}
