apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferenceservices.fleet.sqe.io
spec:
  group: fleet.sqe.io
  scope: Namespaced
  names: {kind: InferenceService, listKind: InferenceServiceList, plural: inferenceservices, singular: inferenceservice, shortNames: [isvc]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Ready, type: string, jsonPath: .status.phase}
        - {name: Replicas, type: integer, jsonPath: .status.readyReplicas}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [model, container]
              properties:
                model:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1}
                    version: {type: string}
                    uri: {type: string}
                container:
                  type: object
                  required: [image]
                  properties:
                    image: {type: string, minLength: 1}
                    imagePullPolicy: {type: string, enum: [Always, IfNotPresent, Never], default: IfNotPresent}
                    command: {type: array, items: {type: string}}
                    args: {type: array, items: {type: string}}
                    port: {type: integer, minimum: 1, maximum: 65535, default: 8080}
                    env:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string}
                          value: {type: string}
                          valueFrom: {type: object, x-kubernetes-preserve-unknown-fields: true}
                    envFrom: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                    volumeMounts: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                    resources: {type: object, x-kubernetes-preserve-unknown-fields: true}
                replicas: {type: integer, minimum: 0, default: 1}
                suspend: {type: boolean, default: false}
                forceActive: {type: boolean, default: false}
                serviceAccountName: {type: string, default: default}
                automountServiceAccountToken: {type: boolean, default: false}
                terminationGracePeriodSeconds: {type: integer, minimum: 0, default: 60}
                imagePullSecrets: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                initContainers: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                volumes: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                affinity: {type: object, x-kubernetes-preserve-unknown-fields: true}
                accelerator:
                  type: object
                  properties:
                    count: {type: integer, minimum: 1, default: 1}
                    minimumMemoryGiB: {type: integer, minimum: 1}
                    class: {type: string, enum: [auto, gpu-24gb, gpu-48gb, gpu-80gb, gpu-80gb-plus], default: auto}
                    products:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: {type: string, minLength: 1}
                    fit:
                      type: object
                      required: [modules]
                      properties:
                        safetyMarginPercent: {type: number, minimum: 0, maximum: 100, default: 10}
                        modules:
                          type: array
                          minItems: 1
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys: [name]
                          items:
                            type: object
                            required: [name, memoryGiB]
                            properties:
                              name: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'}
                              memoryGiB: {type: number, exclusiveMinimum: 0}
                              distribution: {type: string, enum: [sharded, replicated], default: replicated}
                autoscaling:
                  type: object
                  properties:
                    enabled: {type: boolean, default: false}
                    minReplicas: {type: integer, minimum: 0, default: 0}
                    maxReplicas: {type: integer, minimum: 1}
                    pollingInterval: {type: integer, minimum: 1}
                    cooldownPeriod: {type: integer, minimum: 0}
                    triggers:
                      type: array
                      items:
                        type: object
                        required: [type, metadata]
                        properties:
                          type: {type: string}
                          name: {type: string}
                          metricType: {type: string}
                          useCachedMetrics: {type: boolean}
                          metadata: {type: object, additionalProperties: {type: string}}
                          authenticationRef:
                            type: object
                            required: [name]
                            properties:
                              name: {type: string}
                              kind: {type: string, enum: [TriggerAuthentication, ClusterTriggerAuthentication]}
                    fallback:
                      type: object
                      required: [failureThreshold, replicas]
                      properties:
                        failureThreshold: {type: integer, minimum: 1}
                        replicas: {type: integer, minimum: 1}
                        behavior: {type: string}
                service:
                  type: object
                  properties:
                    type: {type: string, enum: [ClusterIP, NodePort, LoadBalancer], default: ClusterIP}
                    port: {type: integer, minimum: 1, maximum: 65535}
                    annotations: {type: object, additionalProperties: {type: string}}
                gateway:
                  type: object
                  properties:
                    enabled: {type: boolean, default: false}
                    name: {type: string, default: model-fleet}
                    namespace: {type: string, default: model-fleet-system}
                    sectionName: {type: string, enum: [http, https], default: http}
                    hostnames: {type: array, items: {type: string}}
                    pathPrefix: {type: string, pattern: '^/', default: /}
                nodeSelector: {type: object, additionalProperties: {type: string}}
                tolerations: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                readyReplicas: {type: integer, minimum: 0}
                url: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions: {type: array, x-kubernetes-list-type: map, x-kubernetes-list-map-keys: [type], items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
