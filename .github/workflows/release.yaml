name: Verified OLM release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  package:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.names.outputs.version }}
      registry: ${{ steps.names.outputs.registry }}
      controller: ${{ steps.controller.outputs.digest }}
      bundle: ${{ steps.bundle.outputs.digest }}
      catalog: ${{ steps.catalog.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release identity
        id: names
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF" = "refs/tags/v$VERSION" || {
            echo "::error::Select the v$VERSION tag, not a branch, for a release run."
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push controller
        id: controller
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.registry }}/model-fleet-operator:${{ steps.names.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Install bundle tools
        run: |
          pip install PyYAML==6.0.3 build
          bash scripts/install_olm_tools.sh "$RUNNER_TEMP/olm-tools"
          echo "$RUNNER_TEMP/olm-tools" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.config/containers"
          printf '{"default":[{"type":"insecureAcceptAnything"}]}\n' > "$HOME/.config/containers/policy.json"
      - name: Generate and validate digest-pinned bundle
        env:
          IMG: ${{ steps.names.outputs.registry }}/model-fleet-operator@${{ steps.controller.outputs.digest }}
        run: |
          python scripts/build_bundle.py
          operator-sdk bundle validate dist/olm/bundle --select-optional suite=operatorframework
      - name: Build and push bundle
        id: bundle
        uses: docker/build-push-action@v6
        with:
          context: dist/olm/bundle
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.registry }}/model-fleet-operator-bundle:${{ steps.names.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Generate catalog and installation artifacts
        env:
          VERSION: ${{ steps.names.outputs.version }}
          REGISTRY: ${{ steps.names.outputs.registry }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          mkdir -p dist/olm/catalog
          opm init model-fleet-operator --default-channel=alpha --output=yaml > dist/olm/catalog/index.yaml
          opm render "$REGISTRY/model-fleet-operator-bundle@$BUNDLE_DIGEST" --output=yaml >> dist/olm/catalog/index.yaml
          printf '\n---\nschema: olm.channel\npackage: model-fleet-operator\nname: alpha\nentries:\n  - name: model-fleet-operator.v%s\n' "$VERSION" >> dist/olm/catalog/index.yaml
          opm validate dist/olm/catalog
          opm generate dockerfile dist/olm/catalog --builder-image=quay.io/operator-framework/opm:v1.74.0 --base-image=quay.io/operator-framework/opm:v1.74.0
      - name: Build and push catalog
        id: catalog
        uses: docker/build-push-action@v6
        with:
          context: dist/olm
          file: dist/olm/catalog.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.registry }}/model-fleet-operator-catalog:${{ steps.names.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Assemble release assets
        env:
          VERSION: ${{ steps.names.outputs.version }}
          REGISTRY: ${{ steps.names.outputs.registry }}
          CONTROLLER: ${{ steps.controller.outputs.digest }}
          BUNDLE: ${{ steps.bundle.outputs.digest }}
          CATALOG: ${{ steps.catalog.outputs.digest }}
        run: |
          mkdir -p dist/release
          python -m build --outdir dist/release
          helm package charts/model-fleet-operator --destination dist/release
          tar -czf "dist/release/model-fleet-operator-olm-$VERSION.tar.gz" -C dist/olm bundle
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          docs = list(yaml.safe_load_all(Path("config/olm/install.yaml").read_text()))
          for doc in docs:
              if doc["kind"] == "CatalogSource":
                  doc["spec"]["image"] = f'{os.environ["REGISTRY"]}/model-fleet-operator-catalog@{os.environ["CATALOG"]}'
              if doc["kind"] == "Subscription":
                  doc["spec"]["startingCSV"] = f'model-fleet-operator.v{os.environ["VERSION"]}'
          Path("dist/release/install.yaml").write_text(yaml.safe_dump_all(docs, sort_keys=False))
          PY
          printf '%s\n' "$REGISTRY/model-fleet-operator@$CONTROLLER" "$REGISTRY/model-fleet-operator-bundle@$BUNDLE" "$REGISTRY/model-fleet-operator-catalog@$CATALOG" > dist/release/images.txt
          (cd dist/release && sha256sum ./* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: olm-release
          path: dist/

  verify:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REGISTRY: ${{ needs.package.outputs.registry }}
      CONTROLLER: ${{ needs.package.outputs.controller }}
      BUNDLE: ${{ needs.package.outputs.bundle }}
      CATALOG: ${{ needs.package.outputs.catalog }}
      KUBECONFIG: ${{ github.workspace }}/test-kubeconfig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify anonymous image access
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          for image in "model-fleet-operator@$CONTROLLER" "model-fleet-operator-bundle@$BUNDLE" "model-fleet-operator-catalog@$CATALOG"; do
            docker pull "$REGISTRY/$image" || {
              echo '::error::Make all three GHCR packages public, then rerun this verify job.'
              exit 1
            }
          done
      - name: Install tools
        run: bash scripts/install_olm_tools.sh "$RUNNER_TEMP/olm-tools" && echo "$RUNNER_TEMP/olm-tools" >> "$GITHUB_PATH"
      - uses: helm/kind-action@v1
        with:
          version: v0.30.0
          node_image: kindest/node:v1.34.0
          cluster_name: model-fleet-olm
      - uses: actions/download-artifact@v4
        with:
          name: olm-release
          path: dist
      - name: Install through the published catalog and exercise every CRD
        run: |
          (cd dist/release && sha256sum -c SHA256SUMS)
          operator-sdk olm install --version 0.46.0 --timeout 5m
          kubectl apply -f dist/release/install.yaml
          bash scripts/verify_olm.sh
          test "$(kubectl -n model-fleet-system get deployment model-fleet-operator -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$REGISTRY/model-fleet-operator@$CONTROLLER"
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p evidence
          kubectl get csv,subscription,installplan -A -o yaml > evidence/olm.yaml 2>&1 || true
          kubectl get pods -A -o wide > evidence/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > evidence/events.txt 2>&1 || true
          kubectl -n model-fleet-system logs deployment/model-fleet-operator > evidence/operator.log 2>&1 || true
          kubectl -n model-fleet-smoke get inferenceservices,trainingruns,datasets,agentregistrations,deployments,jobs -o yaml > evidence/workloads.yaml 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olm-evidence
          path: evidence/
      - name: Remove test cluster
        if: always()
        run: kind delete cluster --name model-fleet-olm

  release:
    needs: [package, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: olm-release
          path: dist
      - name: Create verified GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title "Model Fleet Operator $GITHUB_REF_NAME" \
            --notes 'Initial alpha release. Includes amd64/arm64 controller, OLM bundle and catalog, Helm archive, Python distributions, digest-pinned OLM install manifest and checksums. Verified by installing the published catalog and reconciling all four bundled CRDs on Kubernetes 1.34. Optional platform integrations and GPU workloads are not certified by this CPU smoke test. OperatorHub availability depends on upstream review.'
