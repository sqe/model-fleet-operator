apiVersion: fleet.sqe.io/v1alpha1
kind: TrainingRun
metadata:
  name: resnet50-20260828
  namespace: models
spec:
  image: nvcr.io/nvidia/pytorch:26.07-py3
  command: [python, /workspace/train.py]
  args: [--epochs, "10", --output, /artifacts/resnet50]
  env:
    - name: MLFLOW_TRACKING_URI
      value: http://mlflow.models.svc:5000
  resources:
    requests:
      cpu: "4"
      memory: 24Gi
      nvidia.com/gpu: "1"
    limits:
      nvidia.com/gpu: "1"
  accelerator:
    count: 1
    fit:
      modules:
        - {name: model-and-gradients, memoryGiB: 8, distribution: sharded}
        - {name: optimizer-state, memoryGiB: 10, distribution: sharded}
        - {name: cuda-runtime, memoryGiB: 3, distribution: replicated}
      safetyMarginPercent: 10
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 43200
  nodeSelector:
    workload.sqe.io/class: training
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: training-workspace
    - name: artifacts
      persistentVolumeClaim:
        claimName: model-artifacts
  volumeMounts:
    - {name: workspace, mountPath: /workspace}
    - {name: artifacts, mountPath: /artifacts}
