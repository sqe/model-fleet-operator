apiVersion: v1
kind: Namespace
metadata:
  name: model-artifacts
  labels: {app.kubernetes.io/part-of: model-fleet-artifacts}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: model-artifacts}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: model-artifacts}
spec:
  replicas: 1
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: registry:3.1.1
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: registry-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: model-artifacts}
spec: {type: ClusterIP, selector: {app: registry}, ports: [{port: 5000, targetPort: 5000}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: minio-data, namespace: model-artifacts}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: model-artifacts}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data, --console-address, ":9001"]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: artifact-credentials, key: minio-user}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: artifact-credentials, key: minio-password}}}
          ports: [{containerPort: 9000}, {containerPort: 9001}]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: minio-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: model-artifacts}
spec:
  type: ClusterIP
  selector: {app: minio}
  ports: [{name: s3, port: 9000}, {name: console, port: 9001}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: create-artifact-buckets, namespace: model-artifacts}
spec:
  backoffLimit: 12
  template:
    metadata: {labels: {app: create-artifact-buckets}}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-client
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: [/bin/sh, -c]
          args:
            - >-
              mc alias set artifacts http://minio:9000 "$MINIO_USER" "$MINIO_PASSWORD" &&
              mc mb --ignore-existing artifacts/models &&
              mc mb --ignore-existing artifacts/datasets &&
              mc mb --ignore-existing artifacts/mlflow
          env:
            - {name: MINIO_USER, valueFrom: {secretKeyRef: {name: artifact-credentials, key: minio-user}}}
            - {name: MINIO_PASSWORD, valueFrom: {secretKeyRef: {name: artifact-credentials, key: minio-password}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mlflow-data, namespace: model-artifacts}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: model-artifacts}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.3.2
          args: [mlflow, server, --host, 0.0.0.0, --port, "5000", --backend-store-uri, "sqlite:////data/mlflow.db", --default-artifact-root, "s3://mlflow/"]
          env:
            - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://minio:9000"}
            - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: artifact-credentials, key: minio-user}}}
            - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: artifact-credentials, key: minio-password}}}
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: mlflow-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: model-artifacts}
spec: {type: ClusterIP, selector: {app: mlflow}, ports: [{port: 5000, targetPort: 5000}]}
