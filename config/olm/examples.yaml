apiVersion: fleet.sqe.io/v1alpha1
kind: InferenceService
metadata:
  name: model-echo
spec:
  model: {name: local-smoke-test}
  container: {image: ealen/echo-server:0.9.2, port: 80}
  replicas: 1
  service: {port: 80}
  gateway: {enabled: false}
---
apiVersion: fleet.sqe.io/v1alpha1
kind: TrainingRun
metadata:
  name: cpu-smoke-test
spec:
  image: python:3.13-slim
  command: [python, -c, "print('Model Fleet training job completed')"]
  backoffLimit: 0
  activeDeadlineSeconds: 300
---
apiVersion: fleet.sqe.io/v1alpha1
kind: Dataset
metadata:
  name: example-v1
spec:
  uri: s3://replace-with-your-bucket/datasets/example/v1/
  version: v1
  format: parquet
  owner: example-team
  classification: internal
  allowedServiceAccounts: [default]
---
apiVersion: fleet.sqe.io/v1alpha1
kind: AgentRegistration
metadata:
  name: example-agent
spec:
  name: example-agent
  description: Metadata-only example; deploy the referenced agent separately.
  version: 1.0.0
  endpoint: http://example-agent.default.svc:8000
  kafka_topic: tasks.example
  kafka_result_topic: results.example
  max_concurrent_tasks: 1
  timeout_seconds: 30
  skills:
    - {id: example, name: Example, description: Example skill, input_schema: {}}
