apiVersion: v1
kind: Namespace
metadata:
  name: model-fleet-system
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: model-fleet-catalog
  namespace: olm
spec:
  sourceType: grpc
  image: ghcr.io/sqe/model-fleet-operator-catalog:0.1.0
  displayName: Model Fleet Operator
  publisher: Aziz Kurbanov
  grpcPodConfig: {securityContextConfig: restricted}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: model-fleet
  namespace: model-fleet-system
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: model-fleet-operator
  namespace: model-fleet-system
spec:
  channel: alpha
  name: model-fleet-operator
  source: model-fleet-catalog
  sourceNamespace: olm
  startingCSV: model-fleet-operator.v0.1.0
  installPlanApproval: Automatic
