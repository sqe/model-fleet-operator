display_information:
  name: Model Fleet
  description: Operate model inference, training, agents, and cost reporting
  background_color: "#17324d"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Model Fleet
    always_online: false
  slash_commands:
    - command: /fleet
      description: Inspect or operate Model Fleet workloads
      usage_hint: status | cost | wake | auto | sleep | help
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - files:write
      - im:history
      - im:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
